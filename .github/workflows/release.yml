name: Release

on:
  push:
    tags:
      - "zorg-v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Prepare Binary
        run: |
          BINARY="target/x86_64-unknown-linux-musl/release/zorg"
          strip "$BINARY"
          mkdir -p dist
          cp "$BINARY" dist/zorg

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: zorg-binary
          path: dist/zorg
          retention-days: 1

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download Artifact
        uses: actions/download-artifact@v8
        with:
          name: zorg-binary
          path: dist

      - name: Get tag info
        id: info
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          
          # Force-fetch tags for annotation extraction
          git fetch --tags --force
          
          # Format Title
          RAW="${TAG#zorg-}"
          VERSION=$(echo "$RAW" | cut -d'-' -f1)
          TITLE_PART=$(echo "$RAW" | cut -d'-' -s -f2-)
          TITLE="Zorg ${VERSION}"
          if [ -n "$TITLE_PART" ]; then
            CLEAN_TITLE=$(echo "$TITLE_PART" | tr '-' ' ' | awk '{for(i=1;i<=NF;i++) $i=toupper(substr($i,1,1)) substr($i,2)}1')
            TITLE="${TITLE} - ${CLEAN_TITLE}"
          fi
          echo "title=$TITLE" >> $GITHUB_OUTPUT
          
          # Extract Message
          MESSAGE=$(git tag -l "$TAG" --format='%(contents)')
          echo "message<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Generate Checksum
        run: |
          cd dist
          sha256sum zorg > zorg.sha256

      - name: Prepare Body
        id: body
        run: |
          BODY=$(printf "%s\n\n%s\n" \
          "${{ steps.info.outputs.message }}" \
          "## Installation:
          
          Download the binary, give it execution rights and move it into your \$PATH.
          
          \`\`\`bash
          chmod +x zorg
          mv zorg ~/.local/bin/
          \`\`\`")
          
          echo "content<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.info.outputs.title }}
          tag_name: ${{ steps.info.outputs.tag_name }}
          body: ${{ steps.body.outputs.content }}
          files: |
            dist/zorg
            dist/zorg.sha256

  update-aur:
    name: Update AUR Packages
    needs: release
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    steps:
      - name: Install tools
        run: |
          pacman -Syu --noconfirm git openssh curl base-devel
          useradd -m builder

      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version
        id: version
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#zorg-v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Compute checksums
        id: sums
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          BINARY_B2=$(curl -sL "https://github.com/Zwielichtig/zorg/releases/download/${TAG}/zorg" | b2sum | cut -d' ' -f1)
          SOURCE_B2=$(curl -sL "https://github.com/Zwielichtig/zorg/archive/refs/tags/${TAG}.tar.gz" | b2sum | cut -d' ' -f1)
          LICENSE_B2=$(curl -sL "https://raw.githubusercontent.com/Zwielichtig/zorg/refs/tags/${TAG}/LICENSE.md" | b2sum | cut -d' ' -f1)
          echo "binary=$BINARY_B2" >> $GITHUB_OUTPUT
          echo "source=$SOURCE_B2" >> $GITHUB_OUTPUT
          echo "license=$LICENSE_B2" >> $GITHUB_OUTPUT

      - name: Setup AUR SSH
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          echo "$AUR_SSH_KEY" > /root/.ssh/aur_ed25519
          chmod 600 /root/.ssh/aur_ed25519
          ssh-keyscan -t rsa,ecdsa,ed25519 aur.archlinux.org >> /root/.ssh/known_hosts
          chmod 644 /root/.ssh/known_hosts
          printf 'Host aur.archlinux.org\n  IdentityFile /root/.ssh/aur_ed25519\n  User aur\n  StrictHostKeyChecking accept-new\n' > /root/.ssh/config
          chmod 600 /root/.ssh/config

      - name: Configure git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update zorg-bin on AUR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BINARY_B2: ${{ steps.sums.outputs.binary }}
          LICENSE_B2: ${{ steps.sums.outputs.license }}
        run: |
          git clone ssh://aur@aur.archlinux.org/zorg-bin.git /tmp/aur-zorg-bin

          # Fill in version and checksums from the repo template
          sed \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/BINARY_B2SUM/${BINARY_B2}/" \
            -e "s/LICENSE_B2SUM/${LICENSE_B2}/" \
            aur/zorg-bin/PKGBUILD > /tmp/aur-zorg-bin/PKGBUILD

          cd /tmp/aur-zorg-bin
          chown -R builder .
          su builder -c "makepkg --printsrcinfo" > .SRCINFO
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to ${VERSION}"
          git push

      - name: Update zorg on AUR
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_B2: ${{ steps.sums.outputs.source }}
        run: |
          git clone ssh://aur@aur.archlinux.org/zorg.git /tmp/aur-zorg

          sed \
            -e "s/^pkgver=.*/pkgver=${VERSION}/" \
            -e "s/SOURCE_B2SUM/${SOURCE_B2}/" \
            aur/zorg/PKGBUILD > /tmp/aur-zorg/PKGBUILD

          cd /tmp/aur-zorg
          chown -R builder .
          su builder -c "makepkg --printsrcinfo" > .SRCINFO
          git add PKGBUILD .SRCINFO
          git diff --cached --quiet || git commit -m "Update to ${VERSION}"
          git push